	<div style="overflow: hidden;box-sizing: border-box;background-color:#bc342a;text-align:center; top: 0%;box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">
	<h3><center><img src="AeteraArtis2.png"height="auto" width="30%" ></center>

	<div class="container">
	<a href="index.html"class="fa fa-arrow-left"></a>
	<center><h3><span class="header2">REGISTRATION</h3></span><br><br></center>
	<div style="padding-left: 20% ;overflow: auto;">
		<!-- Removed method and action attributes so JavaScript can handle the submission safely -->
<form id="registerForm" name="form1">
    <p>Full Name:</p>
    <input type="text" id="reg-fullname" name="Fullname" placeholder="Fullname" required>
    
    <p>Birthday:</p>
    <input type="date" id="birthday" name="birthday">
    
    <p>Country:</p>
    <select id="reg-country" name="Country" class="select" required>
        <option value="" selected disabled>Select your country</option>
        <option>Japan</option>
        <option>USA</option>
        <option>Philippines</option>
        <option>North Korea</option>
        <option>South Korea</option>
    </select>
    <p>Email:</p>
    <input type="text" id="reg-uname" placeholder="Enter Username" name="uname" required>
    
    <p>Password:</p>
    <input type="password" id="pass" placeholder="Enter Password" name="psw" required>
    
    <p>Re-Password:</p>
    <input type="password" id="re-pass" placeholder="Enter Password" name="re-psw" required>
    
    <p>Gender:</p>
    <!-- Kept your radio buttons with unique names and values -->
    <input type="radio" name="gender" value="M" required/>Male
    <input type="radio" name="gender" value="F" required/>Female
    <input type="radio" name="gender" value="O" required/>Other<br><br>
<script>
const googleScriptUrl = "https://script.google.com/macros/s/AKfycbzQe6jV_i9nG-YLHxPtp2RdM0gUxWpGwNbXCx5vkrto2uNkWkNSKaLM5i_WbEP3GIeG/exec"; 

document.getElementById("registerForm").addEventListener("submit", function(e) {
  e.preventDefault();

  // Basic manual password validation matching check
  if (document.getElementById("pass").value !== document.getElementById("re-pass").value) {
    alert("Passwords do not match!");
    return;
  }

  // Pack all your input fields instantly by their HTML name tags
  let payload = Object.fromEntries(new FormData(this));
  payload.action = "register"; 

  fetch(googleScriptUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    if (data.result === "success") {
      alert("Registered successfully!");
      window.location.href = "index.html";
    } else {
      alert("Error: " + data.message);
    }
  });
});
</script>

	<hr>

        <input class="button" type="submit" value="Sign up"/>

    </center><br>
	</form>
