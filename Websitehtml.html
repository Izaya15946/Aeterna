<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>| Arts:Gallery |</title>
    <link rel="shortcut icon" href="pics/logo/finishlogo2.0.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="Website.css">
    <script src="Profile.js"></script>
    <script src="posts.js"></script>

</head>
<body>

    <!-- NAVIGATION BAR -->
    <div class="navbar">
        <a href="Websitehtml.html" class="logo-wrapper">
            <img src="AeteraArtis2.png" alt="Aeterna Artis Logo" class="site-logo">
        </a>
        
        <div class="content">
            <a href="Websitehtml.html" class="active">HOME</a>
        </div>
        <div class="content">
            <div class="dropdown">
                <a href="Gallery.html" class="dropbtn">EXPLORE <i class="fa fa-chevron-down arrow-icon"></i></a>
                <div class="dropdown-content">
                    <a href="GlowingArt.html">GLOW ARTS</a>
                    <a href="DigitalArt.html">DIGITAL ARTS</a>
                </div>
            </div>
        </div>
		 <div class="content">
			<div class="dropdown">
        <a href="Home.html" class="dropbtn">ABOUT US <i class="fa fa-chevron-down arrow-icon"></i></a>
                <div class="dropdown-content">
                    <a href="Profile.html">CREATOR</a>
                </div>
            </div>
		</div>
        <div class="content"><a href="AccountProfile.html">PROFILE</a></div>
        <div class="content"><a href="#" id="navLogout">LOGOUT</a></div>
    </div>

    <!-- HERO / BANNER -->
    <div class="backimg1">
        <div class="header">
            <img src="AeteraArtis2.png"height="auto" width="30%">
            <p>Discover, share, and celebrate digital & glowing artworks.</p>
        </div>
    </div>

    <!-- MAIN PAGE LAYOUT -->
    <div class="layout">
        <div class="left-layer">
        <!-- LEFT SIDEBAR -->
        <div class="leftsidebar">
            <h3>Quick Navigation</h3>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa fa-home"></i> Feed</p></a>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa-solid fa-fire"></i> Trending</p></a>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa fa-bookmark"></i> Dashboard</p></a>
			<a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa-solid fa-gear"></i> Settings</p></a>
        </div>
        <div class="leftsidebar">
            <h3>Post Type</h3>
            <button class="filter-btn active" onclick="filterPosts('postType', 'All')">All Types</button>
            <button class="filter-btn" onclick="filterPosts('postType', 'Showcasing')">Showcasing</button>
            <button class="filter-btn" onclick="filterPosts('postType', 'Selling')">Selling</button>
            </div>
        </div>
        <!-- FEED CONTAINER -->
        <div class="middle-layer">
            
                    <div class="create-post-bar">
                        <img class="profile-pic" src="Profile-Placeholder.png" alt="Profile">
                        <button id="openModalBtn" type="button">Share your thoughts or artworks...</button>
                        </div>

            <!-- Post Modal Window -->
                    <div id="postModal" class="modal">
                    <div class="modal-content">
                        <h3>Create New Post</h3>
                        
                        <!-- Horizontal Dropdowns -->
                        <div class="form-row">
                        <div class="form-group">
                            <label for="modalCategory">Category</label>
                            <select id="modalCategory">
                            <option value="Digital Art">Digital Art</option>
                            <option value="Traditional Art">Traditional Art</option>
                            <option value="3D Model">3D Model</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="modalPostType">Post Type</label>
                            <select id="modalPostType">
                            <option value="Showcasing">Showcasing</option>
                            <option value="Selling">Selling</option>
                            </select>
                        </div>
                        </div>

                        <!-- Description -->
                        <label for="modalContent">Description</label>
                        <textarea id="modalContent" placeholder="Describe your artwork or thoughts..."></textarea>

                        <!-- File Upload and Live Preview -->
                        <label for="modalImageInput">Upload Artwork</label>
                        <input type="file" id="modalImageInput" accept="image/*">
                        <div id="imagePreviewContainer" style="display:none; margin-bottom:15px; text-align:center;">
                        <img id="imagePreview" src="" alt="Preview" style="max-width:100%; max-height:200px; border-radius:8px; border:1px solid #32323e;">
                        </div>

                        <!-- Actions -->
                        <div class="modal-actions">
                        <button id="closeModalBtn" type="button" class="btn-cancel">Cancel</button>
                        <button id="submitModalPostBtn" type="button" class="btn-submit">Post</button>
                        </div>
                    </div>
                    
            
                </div>
                <div id="feedContainer"></div>
        </div>
        <div class="right-layer">
        <!-- RIGHT SIDEBAR -->
        <div class="rightsidebar">
            <h3>Popular Tags</h3>
            <div class="tags-container">
            <span class="filter-btn" style="display:inline-block; width:auto;">#Traditional</span>
            <span class="filter-btn" style="display:inline-block; width:auto;">#DigitalArts</span>
            </div>
        </div>
        <div class="rightsidebar">
        <h3>Categories</h3>
        <button class="filter-btn active" onclick="filterPosts('category', 'All')">All Categories</button>
        <button class="filter-btn" onclick="filterPosts('category', 'Digital Art')">Digital Art</button>
        <button class="filter-btn" onclick="filterPosts('category', 'Traditional Art')">Traditional Art</button>
        <button class="filter-btn" onclick="filterPosts('category', '3D Model')">3D Model</button>
        </div>
</div>
    
<div id="imageLightbox" class="modal" style="display: none; background-color: rgba(0, 0, 0, 0.9); cursor: pointer;" onclick="closeLightbox()">
    <span style="position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold;">&times;</span>
    <img id="lightboxImg" style="max-width: 90%; max-height: 90vh; margin: auto; display: block; border-radius: 8px; object-fit: contain;">
</div>
</body>
</html>
