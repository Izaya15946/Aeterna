<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>| Arts:Gallery |</title>
    <link rel="shortcut icon" href="pics/logo/finishlogo2.0.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="Website.css">
    <script src="Profile.js"></script>
    <script src="posts.js"></script>

</head>
<body>

    <!-- NAVIGATION BAR -->
    <div class="navbar">
        <a href="Websitehtml.html" class="logo-wrapper">
            <img src="AeteraArtis2.png" alt="Aeterna Artis Logo" class="site-logo">
        </a>
        
        <div class="content">
            <a href="Websitehtml.html" class="active">HOME</a>
        </div>
        <div class="content">
            <div class="dropdown">
                <a href="Gallery.html" class="dropbtn">EXPLORE <i class="fa fa-chevron-down arrow-icon"></i></a>
                <div class="dropdown-content">
                    <a href="GlowingArt.html">GLOW ARTS</a>
                    <a href="DigitalArt.html">DIGITAL ARTS</a>
                </div>
            </div>
        </div>
		 <div class="content">
			<div class="dropdown">
        <a href="Home.html" class="dropbtn">ABOUT US <i class="fa fa-chevron-down arrow-icon"></i></a>
                <div class="dropdown-content">
                    <a href="Profile.html">CREATOR</a>
                </div>
            </div>
		</div>
        <div class="content"><a href="AccountProfile.html">PROFILE</a></div>
        <div class="content"><a href="#" id="navLogout">LOGOUT</a></div>
    </div>

    <!-- HERO / BANNER -->
    <div class="backimg1">
        <div class="header">
            <img src="AeteraArtis2.png"height="auto" width="30%">
            <p>Discover, share, and celebrate digital & glowing artworks.</p>
        </div>
    </div>

    <!-- MAIN PAGE LAYOUT -->
    <div class="layout">

        <!-- LEFT SIDEBAR -->
        <div class="leftsidebar">
            <h3>Quick Navigation</h3>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa fa-home"></i> Feed</p></a>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa-solid fa-fire"></i> Trending</p></a>
            <a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa fa-bookmark"></i> Dashboard</p></a>
			<a href="Websitehtml.html" style="text-decoration: none;"><p><i class="fa-solid fa-gear"></i> Settings</p></a>
        </div>
        
        <!-- FEED CONTAINER -->
        <div class="middle-layer">
            
            <div class="middlebox">
                <h3>
                    <<div class="create-post-bar" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                    <img class="profile-pic" src="Profile-Placeholder.png" alt="Profile" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                    <button id="openModalBtn" style="flex: 1; text-align: left; padding: 10px 15px; border-radius: 20px; border: 1px solid #444; background: #222; color: #888; cursor: pointer;">
                        Share your thoughts or artworks...
                    </button>
                    </div>

<!-- Post Modal Window -->
                    <div id="postModal" class="modal" style="display:none; position:fixed; z-index:999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6);">
                    <div style="background:#222; color:#fff; margin:10% auto; padding:20px; width:90%; max-width:450px; border-radius:8px;">
                        <h3>Create New Post</h3>
                        
                        <label>Category:</label>
                        <select id="modalCategory" style="width:100%; margin-bottom:10px;">
                        <option value="Digital Art">Digital Art</option>
                        <option value="Traditional Art">Traditional Art</option>
                        <option value="3D Model">3D Model</option>
                        </select>

                        <label>Post Type:</label>
                        <select id="modalPostType" style="width:100%; margin-bottom:10px;">
                        <option value="Showcasing">Showcasing</option>
                        <option value="Selling">Selling</option>
                        </select>

                        <textarea id="modalContent" placeholder="Describe your post..." style="width:100%; height:80px; margin-bottom:10px;"></textarea>

                        <label>Upload Artwork Image:</label>
                        <input type="file" id="modalImageInput" accept="image/*" style="margin-bottom:15px;">

                        <div style="text-align:right;">
                        <button id="closeModalBtn" type="button">Cancel</button>
                        <button id="submitModalPostBtn" type="button">Post</button>
                        </div>
                    </div>
                    </div>
                </h3>
            </div>
            
                <div id="feedContainer"></div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <div class="rightsidebar">
            <h3>Popular Tags</h3>
            <p>#GlowArts</p>
            <p>#DigitalArts</p>
            <p>#CoolArt</p>
        </div>

    </div>

</body>
</html>
